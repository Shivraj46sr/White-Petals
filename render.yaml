services:
  - type: web
    name: white-petals-resort
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    disk:
      name: white-petals-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/white_petals_sales.db
      - key: BACKUP_PATH
        value: /var/data/backups
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: 0.0.0.0
